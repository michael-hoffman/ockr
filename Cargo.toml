[workspace]
members = [".", "ockr-plugin"]
# ockr-plugin-example / ockr-plugin-typst-example build only for wasm32
# (their cdylibs link against wasm host-imports that don't exist on the
# host), so they're excluded from the host workspace build. Build with:
# cargo build --target wasm32-unknown-unknown.
exclude = ["ockr-plugin-example", "ockr-plugin-typst-example"]
resolver = "2"

[package]
name = "ockr"
version = "0.3.0"
edition = "2021"
description = "A Typst-native, keyboard-driven note editor with a Helix-style modal interface."
authors = ["Michael Hoffman <hoffman1512@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/michael-hoffman/ockr"
keywords = ["typst", "editor", "notes", "helix", "markdown"]
categories = ["text-editors"]

[[bin]]
name = "ockr"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2", features = ["macos-blade"] }
typst = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-render = "0.15"
typst-html = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
image = "0.25"
time = { version = "0.3", features = ["local-offset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["parse", "display"] }
dirs = "7"
futures = "0.3"
wasmtime = { version = "50", features = ["cranelift"] }
wasmtime-wasi = "50"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", features = ["blocking"] }
trash = "5"
regex = "1"
tree-sitter = "0.26"
codebook-tree-sitter-typst = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSTextCheckingResult", "NSOrthography"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSView", "NSWindow", "NSSpellChecker", "block2"] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKUserContentController",
    "WKUserScript",
    "WKScriptMessage",
    "WKScriptMessageHandler",
] }
