[workspace]
# Stand-alone package, deliberately not a member of the host workspace at
# ../Cargo.toml (its cdylib targets wasm32, which won't cross-compile
# alongside the native host crates) — without this empty table, `cargo
# build` from inside this directory errors: "current package believes it's
# in a workspace when it's not".

[package]
name = "ockr-plugin-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ockr-plugin = { path = "../ockr-plugin" }
